workflow:
  id: design-system-build-quality
  name: Design System Build Quality Pipeline
  version: "2.2"
  description: >-
    Pipeline pos-migracao para Design System. Encadeia sequencialmente as etapas de
    build, documentacao, auditoria de acessibilidade e calculo de ROI para garantir
    qualidade e mensurar valor entregue.
  type: brownfield
  project_types:
    - design-system
    - component-library
    - pattern-library
    - ui-migration

  metadata:
    elicit: true
    confirmation_required: true

  execution_modes:
    - mode: yolo
      description: Execucao autonoma com minima interacao
      prompts: 0-1
    - mode: interactive
      description: Checkpoints de decisao e feedback educacional
      prompts: 5-10
      default: true
    - mode: preflight
      description: Planejamento completo antes da execucao - analise upfront de todos os componentes e dependencias
      prompts: "10-15"

  phases:
    - phase_0: Visual References Curation (Refero Skill 4-step)
    - phase_1: Build & Compile
    - phase_2: Documentation
    - phase_3: Quality Assurance
    - phase_4: ROI Analysis

  sequence:
    - step: visual_references_curation
      id: visual-references
      phase: 0
      agent: ux-design-expert
      action: Curate 8+ visual references with Steal List (Refero Skill methodology, post-conclave v2.2)
      artifacts:
        - benchmark_pack
        - steal_list_md
        - visual_references_md
        - visual_references_tokens_json
        - human_reviewer_approval
      gate:
        condition: |
          Steal_List >= 8 tactics traceable to source URL/screenshot/UUID with rationale
          AND Playwright_captures >= 3 unique sources (mandatory for ALL niches, not only luxury)
          AND Negative_anchor_BR_count >= 1 (Brazilian counter-example documented)
          AND Counter_example >= 1 (1 site da MESMA categoria que parece BARATO, com 3 elementos a evitar)
          AND Pre_mortem_documented = true (3 modos de falha antecipados antes de implementar)
          AND Human_reviewer_approval present (User Breno default — sem isso, HALT)
          AND Tokens_json exported (machine-readable, diff-able no git)
        on_fail: "HALT — cannot proceed to build. Re-run collect-visual-references task with broader query, alternative method, OR obtain missing human approval. See task v1.1 4 sub-gates."
      notes: |
        MANDATORY first step. Breaks the "luxury_taste_calibration" failure loop where squad
        implementa brief mecanicamente sem benchmark visual real ("startup tentando ser premium").

        Post-conclave v2.2 (2026-05-04): threshold 5→8 tactics + 3+ Playwright captures
        + 4 sub-gates novos (counter-example, pre-mortem, negative anchor BR, human reviewer)
        + JSON tokens export. Validados por conclave Jarvis (Nova/Uma/DSE/Kahneman/Holiday).

        Routing by niche (read from project brief):
        - luxury-craft (Bretda, Tocks, Anipis-luxe, hospitality, fashion):
            method: playwright-capture-own
            pool: cassina.com, bottegaveneta.com, aman.com, brunellocucinelli.com, hermes.com, aesop.com, bulgari.com
            output: docs/projects/{project}/design/benchmarks/{date}/
            negative_anchors_BR: saccaro.com.br, artefacto.com.br, carbonodesign.com.br
        - saas | wellness | internal | low-ticket | prediction-markets:
            method: refero-mcp-search (refero_search + refero_design_md)
            cache: .aios-core/data/refero-cache/{niche}/{date}/
            playwright_captures: still mandatory min 3 (don't trust catalog alone)

        Steps (Refero Skill 4-step + 4 sub-gates v1.1):
        1. Discovery — clarify niche + archetype + brand position
        2. Research — 5+ searches, narrow 50+ raw to 8-12 deep
        3. Steal List — extract 8+ stealable tactics, each: source + tactic + how-to-apply
        4. 80/20 Split — 80% proven patterns, 20% brand-unique + anti-AI-slop checklist
        5. 4 Sub-gates — counter-example + pre-mortem + negative anchor BR + human reviewer

        Criterios de sucesso:
        - [ ] >= 8 tactics em Steal List, cada uma rastreavel a source
        - [ ] >= 3 Playwright captures unique sources
        - [ ] benchmark-pack/ com screenshots OU DESIGN.mds armazenados
        - [ ] visual-references.md sintetizado e revisado
        - [ ] visual-references-tokens.json exportado
        - [ ] 4 sub-gates passados (Sub-gate A/B/C/D)
      outputs:
        - benchmark_pack
        - steal_list_md
        - visual_references_md
        - visual_references_tokens_json
        - human_reviewer_approval
      task_reference: collect-visual-references.md

    - step: build_atomic_components
      id: build
      phase: 1
      agent: ux-design-expert
      action: Build de componentes atomicos
      requires: visual-references
      artifacts:
        - build_report
        - compiled_tokens
        - component_bundle
      gate:
        condition: |
          TypeScript 0 errors
          AND all components render
          AND all tokens compiled
          AND anti-tailwind-default-check.js violations <= 3 (post-conclave v2.2)
        on_fail: "HALT and fix build errors before proceeding to documentation. If anti-tailwind violations > 3, run `node .aios-core/development/scripts/anti-tailwind-default-check.js` and override defaults flagged."
      notes: |
        Executa build dos componentes do Design System:
        - Compila tokens de design (cores, tipografia, espacamentos)
        - Gera componentes atomicos (buttons, inputs, cards, etc.)
        - Valida estrutura de arquivos e nomenclatura
        - Verifica dependencias e imports

        Post-conclave v2.2 (2026-05-04): adicionado gate automatizado anti-tailwind-default-check.
        Script scaneia CSS/Tailwind config buscando defaults indicadores de "barato"
        (bg-blue-500, text-gray-900, font-sans sem override, hex #3b82f6, system-ui).
        Threshold = 3 violations (> 3 HALT). Justificativa: alguns defaults legítimos
        em utility classes podem aparecer (ex: text-gray-900 em prose), mas mais que 3
        sinaliza falta de override do design system.

        Criterios de sucesso:
        - [ ] Build completo sem erros
        - [ ] Todos os tokens compilados
        - [ ] Componentes exportados corretamente
        - [ ] anti-tailwind-default-check violations <= 3
      outputs:
        - build_report
        - compiled_tokens
        - component_bundle

    - step: generate_documentation
      id: document
      phase: 2
      agent: ux-design-expert
      action: Gerar documentacao do Pattern Library
      requires: build
      artifacts:
        - pattern_library_docs
        - component_api_reference
        - style_guide
      gate:
        condition: "All components documented with props, variants, and working code examples"
        on_fail: "HALT and complete missing documentation before accessibility audit"
      notes: |
        Gera documentacao completa do Pattern Library:
        - Documenta cada componente com props e variantes
        - Cria exemplos de uso e code snippets
        - Gera guia de estilo visual
        - Atualiza changelog de componentes

        Criterios de sucesso:
        - [ ] Todos os componentes documentados
        - [ ] Exemplos de codigo funcionais
        - [ ] Guia de estilo atualizado
      outputs:
        - pattern_library_docs
        - component_api_reference
        - style_guide

    - step: accessibility_audit
      id: a11y-check
      phase: 3
      agent: ux-design-expert
      action: Auditoria de acessibilidade (WCAG AA)
      requires: document
      artifacts:
        - a11y_audit_report
        - violations_list
        - remediation_plan
      gate:
        condition: "Zero critical WCAG AA violations AND color contrast ratios meet 4.5:1 (text) / 3:1 (UI)"
        on_fail: "HALT — remediate critical a11y violations before ROI calculation"
      notes: |
        Executa auditoria de acessibilidade WCAG 2.1 AA:
        - Verifica contraste de cores (4.5:1 texto, 3:1 UI)
        - Valida navegacao por teclado
        - Checa atributos ARIA e roles
        - Testa com screen readers
        - Verifica focus states e indicadores visuais

        Criterios de sucesso:
        - [ ] Contraste de cores aprovado
        - [ ] Navegacao por teclado funcional
        - [ ] ARIA labels corretos
        - [ ] Zero violacoes criticas WCAG AA
      outputs:
        - a11y_audit_report
        - violations_list
        - remediation_plan

    - step: calculate_roi
      id: calculate-roi
      phase: 4
      agent: ux-design-expert
      action: Calculo de ROI e savings
      requires: a11y-check
      artifacts:
        - roi_report
        - savings_metrics
        - adoption_dashboard
      gate:
        condition: "ROI report complete with all 4 metrics calculated (hours saved, reuse %, feature time, bug reduction)"
        on_fail: "HALT — complete all ROI metrics before finalizing pipeline"
      notes: |
        Calcula retorno sobre investimento do Design System:
        - Tempo economizado em desenvolvimento
        - Reducao de inconsistencias visuais
        - Velocidade de entrega de features
        - Custo de manutencao reduzido
        - Metricas de reuso de componentes

        Metricas a calcular:
        - [ ] Horas dev economizadas/mes
        - [ ] % de reuso de componentes
        - [ ] Tempo medio para nova feature
        - [ ] Reducao de bugs visuais
      outputs:
        - roi_report
        - savings_metrics
        - adoption_dashboard

    - workflow_end:
      action: pipeline_complete
      notes: |
        Pipeline de qualidade completo!

        Artefatos gerados:
        - Build report e bundle de componentes
        - Documentacao do Pattern Library
        - Relatorio de acessibilidade WCAG AA
        - Dashboard de ROI e metricas

        Proximos passos sugeridos:
        - Revisar violacoes de a11y identificadas
        - Publicar nova versao do Design System
        - Compartilhar metricas de ROI com stakeholders

  flow_diagram: |
    ```mermaid
    graph TD
        START[Start: Design System Quality Pipeline] --> VR[ux-design-expert: Visual References Curation - Refero Skill]
        VR --> VRG{Steal List >= 5 tactics?}
        VRG -->|Sim| B[ux-design-expert: Build componentes atomicos]
        VRG -->|Nao| VRX[Re-run collect-visual-references com query mais ampla]
        VRX --> VR

        B --> C{Build OK?}
        C -->|Sim| D[ux-design-expert: Gerar documentacao Pattern Library]
        C -->|Nao| E[Corrigir erros de build]
        E --> B

        D --> F{Docs completas?}
        F -->|Sim| G[ux-design-expert: Auditoria a11y WCAG AA]
        F -->|Nao| H[Completar documentacao]
        H --> D

        G --> I{a11y aprovado?}
        I -->|Sim| J[ux-design-expert: Calcular ROI e savings]
        I -->|Nao| K[Remediar violacoes]
        K --> G

        J --> L[Pipeline Completo]

        style L fill:#90EE90
        style VR fill:#FFE4B5
        style B fill:#E6E6FA
        style D fill:#E6E6FA
        style G fill:#E6E6FA
        style J fill:#E6E6FA
        style E fill:#FFB6C1
        style H fill:#FFB6C1
        style K fill:#FFB6C1
        style VRX fill:#FFB6C1
    ```

  decision_guidance:
    when_to_use:
      - Apos migracao de Design System
      - Release de nova versao do Pattern Library
      - Auditoria periodica de qualidade
      - Validacao pre-producao de componentes
      - Geracao de metricas para stakeholders

  handoff_prompts:
    visual_references_complete: |
      Visual References Curation concluida (Refero Skill 4-step).
      Niche detectado: {{niche}}
      Method: {{method}}  # playwright-capture-own | refero-mcp-search
      Steal List tactics: {{tactic_count}} (gate min: 5)
      Benchmarks capturados: {{benchmark_count}}
      Artefatos: {{benchmark_pack_path}}, {{steal_list_path}}
      Prosseguindo para build de componentes atomicos...

    build_complete: |
      Build de componentes concluido com sucesso.
      Tokens compilados: {{token_count}}
      Componentes gerados: {{component_count}}
      Prosseguindo para documentacao...

    docs_complete: |
      Documentacao do Pattern Library gerada.
      Componentes documentados: {{documented_count}}
      Exemplos criados: {{example_count}}
      Iniciando auditoria de acessibilidade...

    a11y_complete: |
      Auditoria de acessibilidade WCAG AA concluida.
      Status: {{pass/fail}}
      Violacoes criticas: {{critical_count}}
      Violacoes menores: {{minor_count}}
      {{if pass}}: Prosseguindo para calculo de ROI.
      {{if fail}}: Revisar remediation_plan antes de continuar.

    pipeline_complete: |
      Pipeline de qualidade finalizado!

      Resumo:
      - Build: {{build_status}}
      - Documentacao: {{docs_status}}
      - Acessibilidade: {{a11y_status}}
      - ROI calculado: {{roi_value}}

      Artefatos disponiveis em outputs/design-system/

metadata:
  author: Orion (AIOS Master)
  created_date: 2025-01-30
  updated_date: 2026-05-04
  version: 2.2.0
  changelog:
    - "v2.2.0 (2026-05-04): Conclave Jarvis MODIFY applied. Threshold raised 5→8 tactics + 3+ Playwright captures + 4 sub-gates novos (counter-example, pre-mortem, negative anchor BR, human reviewer) + JSON tokens export + anti-tailwind-default-check em phase_1 (>3 violations HALT). Patches v2 prontos pra smoke test em Tocks."
    - "v2.1.0 (2026-05-04): Added phase_0 visual-references-curation step (Refero Skill 4-step methodology). Gate halts pipeline if Steal_List < 5 tactics. Breaks luxury_taste_calibration 4× failure loop on Bretda."
    - "v2.0.0 (2025-01-30): Initial pipeline build->doc->a11y->roi"
  tags:
    - design-system
    - quality-assurance
    - accessibility
    - documentation
    - roi
    - brownfield
    - visual-references
    - refero-methodology
    - conclave-validated
    - anti-ai-slop
