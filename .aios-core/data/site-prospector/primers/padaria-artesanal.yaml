# Site-Prospector Primer — Padaria/Confeitaria Artesanal
# Curated from DRY RUN #1 (Dona Hilda Confeitaria, Blumenau)
# Última atualização: 2026-05-12

version: "1.0"
vertical_id: "padaria-artesanal"
vertical_label_pt: "Padaria/Confeitaria Artesanal"
last_updated: "2026-05-12"
curated_by: "Orion + Breno (DR1 P-006 Dona Hilda)"
status: "active"

customer_journey:
  axis: "emotional-aspirational"
  trigger: "aspirational — quero treat, presente Mães, encomenda aniversário"
  discovery_query_pattern: "[product] + [location]"
  discovery_examples:
    - "padaria artesanal Blumenau"
    - "panettone Itoupava Seca"
    - "cuca artesanal Blumenau"
    - "torta de aniversário Blumenau"
  decision_factors:
    - "fotos do produto (essential)"
    - "story founder + heritage"
    - "reviews ifood + Google"
    - "distância (secondary)"
  cta_primary: "whatsapp-conversational"
  cta_prefill_template: "Olá [nome-padaria]! Vi o site e gostaria de encomendar [produto]. Para data: [data]."
  seasonality: "strong"
  seasonal_dates:
    - "Páscoa (mar-abr) — colomba, ovos artesanais"
    - "Dia das Mães (mai) — torta, cuca presente"
    - "Festa Junina (jun) — cuca de uva fresca, pé-de-moleque"
    - "Natal (dez) — panettone, stollen, encomenda corporativa"

archetype:
  synthesis_label: "Brazilian Traditional Premium — modernized warmly"
  blend:
    heritage_patrimonial: 30
    rustic_authentic: 40
    brazilian_premium: 30

refs:
  global:
    - name: "Tartine Bakery"
      url: "https://tartinebakery.com"
      url_status: "validated DR1"
      city: "San Francisco, USA"
      founder_signal: "Chad Robertson, fundada 2002 — padrão-ouro 'artesanal autêntico'"
      weight_target: 0.40
      archetype: "industrial-rustic-authentic"
      knowledge_base_confidence: "HIGH"
      why: "Padrão-ouro de comunicação visual 'artesanal autêntico' global desde 2002. Fotografia close-up crosta-de-pão é vocabulário inventado por eles. Tipografia editorial warm sem ser pretensiosa."
      tokens_to_extract:
        color: "HIGH"
        typography: "HIGH"
        layout: "MEDIUM"
        spacing: "MEDIUM"
        photography_direction: "VERY HIGH"
      filters_to_apply:
        - "OK majoritariamente — weight regular, contrast OK"
      anti_clone_hedge: "NÃO importar paleta cream-flour-brown integralmente. Tropicalizar com fotografias de cuca/sonho/torta-de-banana (não baguette/sourdough). Trocar accent vermelho-tomate por terracota Mata Atlântica."

    - name: "Hart Bageri"
      url: "https://hartbageri.com"
      url_status: "validated DR1"
      city: "Copenhagen, Denmark"
      weight_target: 0.30
      archetype: "editorial-modern-minimal"
      knowledge_base_confidence: "HIGH"
      why: "Standard de fato pós-2022 de padaria premium contemporânea com site. Disciplina editorial — typography hierarchy clara, fotografia single-product impecável, layout grid respeitado. Awwwards-tier execution."
      tokens_to_extract:
        color: "LOW"  # paleta neutra extrema viola gate AAA se clonada
        typography: "MEDIUM"
        layout: "HIGH"
        spacing: "HIGH"
        photography_direction: "HIGH"
      filters_to_apply:
        - "REJECT thin/light font weights"
        - "REJECT gray-on-white sub-headings if contrast <7:1"
        - "FORCE body ≥18px (Hart usa 16px típico)"
        - "Watch out hover-only nav"
      anti_clone_hedge: "NÃO copiar paleta neutra extrema. Misturar com Tartine warm."
      note_dr1: "Static CSS retornou WooCommerce defaults (WordPress + Bootstrap). Brand essence vem das FOTOS não dos tokens CSS — limitação documentada DR1 LEARNINGS."

    - name: "Poilâne"
      url: "https://poilane.com"
      url_status: "validated DR1"
      city: "Paris, France"
      founder_signal: "fundada 1932, Maison Poilâne, 'depuis 1932' template global"
      weight_target: 0.30
      archetype: "luxury-european-heritage"
      knowledge_base_confidence: "HIGH"
      why: "Signal patrimonial mais forte do nicho mundial. Template de como uma padaria comunica longevidade SEM virar museu mofado. Tipografia patrimônio, monograma 'P', uso disciplinado de preto + creme + ocasional vermelho-Bordeaux."
      tokens_to_extract:
        color: "MEDIUM"
        typography: "MEDIUM"
        layout: "MEDIUM"
        photography_direction: "HIGH"
        heritage_signals: "VERY HIGH"
      filters_to_apply:
        - "OK contrast forte black-on-cream"
        - "Watch out hover-only nav que pode existir"
      anti_clone_hedge: "RISCO ALTO de clone (signature look forte). Pegar APENAS: (a) vocabulário patrimonial 'Desde 1990' stamp + founder photo, (b) disciplina cromática 3 cores max. NÃO clonar serif específica NEM monograma idêntico."

  local:
    - name: "Portus Padaria Artesanal"
      url: "https://portuspadariaartesanal.com.br"
      url_status: "needs_validation_dr1_fetch_failed"
      region: "Blumenau, SC"
      geo_proximity_km: 5
      weight_target: 0.15
      why: "Concorrente direto vizinho geográfico. 4 unidades Blumenau+BC, 26k Insta, mesmo arquétipo europeu. Crítico para anti-clone — Dona Hilda NÃO pode parecer 'filha pobre do Portus'."
      tokens_to_extract:
        vernacular_copy: "HIGH"
        menu_categorization: "HIGH"
        cultural_reference: "MEDIUM"
      anti_clone_hedge: "Posicionar OPOSTO: mais patrimônio (36 anos vs Portus jovem), menos chain (1 padaria vs 4 unidades)."
      fallback_if_broken:
        - "Padaria Bracarense (RJ)"
        - "Pão e Ponto Padaria Artesanal Blumenau"

    - name: "Sul-BR padaria boutique [placeholder]"
      url_status: "needs_validation"
      region: "Sul BR (SC/PR)"
      weight_target: 0.15
      why: "Floor de qualidade BR realista. Calibra ambition dentro do BR."
      candidates:
        - "Cantinho do Pão (Curitiba)"
        - "Cuca Cozinha (Curitiba/Floripa)"
        - "Padaria do Bira (Florianópolis)"
        - "Pão e Toast (Curitiba)"
        - "Pão Pão (Itajaí)"
      tokens_to_extract:
        sitemap_pattern: "HIGH"
        home_sections_typical: "HIGH"
        copy_seasonal_patterns: "HIGH"
        vernacular_fit_sul_BR: "HIGH"
      anti_clone_hedge: "Refs BR são FLOOR não CEILING — elevar acima delas."

color:
  starter_palette:
    bg_primary: "#F7F1E8"
    bg_secondary: "#EFE6D6"
    bg_inverse: "#2A1F1A"
    fg_primary: "#2A1F1A"
    fg_secondary: "#5A4A3F"
    fg_inverse: "#F7F1E8"
    accent_primary: "#B85C3B"     # terracota Mata Atlântica
    accent_dark: "#8E4127"
    accent_light: "#D6896A"
    warning_amber: "#C49531"      # Tartine --gold exact
  rationale: "Cream tropical warmer-than-SF + warm dark brown (NÃO pure black — Tartine pattern). Accent terracota vernacular BR substitui Tartine tomato-red. Amber from Tartine --gold."
  contrast_validation_dr1:
    primary_fg_on_bg: "10.5:1 ✅ AAA"
    secondary_fg_on_bg: "5.2:1 ⚠️ AA pass — restrict to 18px+ 600 weight"
    accent_on_bg: "4.6:1 ⚠️ AA fail body — restrict to ≥24px headings + icon+text"

typography:
  starter:
    display: "Fraunces"
    body: "Inter"
    mono: "JetBrains Mono"
  fallbacks:
    display: ["DM Serif Display", "Playfair Display", "Georgia"]
    body: ["DM Sans", "system-ui"]
  min_body_size_px: 18
  hero_display_clamp: "clamp(56px, 9vw, 96px)"
  semantic_class: "serif-warm-modern-variable"

layout:
  sections_required:
    - hero
    - sazonal-banner-rotativo            # SEASONALITY STRONG
    - sobre-heritage                     # heritage stamp Desde [ANO]
    - cardapio-destaque-grid
    - como-pedir-3-steps                 # whatsapp / ifood / balcão
    - mapa-contato
  sections_optional:
    - reviews-static-carousel            # Kat Holmes: NUNCA autoplay
    - galeria-photo-portfolio
  sections_excluded_for_vertical:
    - servicos-por-sintoma               # mecânica/saúde
    - marcas-atendidas-grid              # B2B/automotive
    - equipe-meister-nominalmente        # B2B/técnico
    - trust-certs-grid                   # mecânica/saúde
  pages_required:
    - home
    - cardapio
    - encomendas
    - sobre                              # opcional mas recomendado
  pages_optional:
    - galeria
    - blog                               # se houver content marketing

photography:
  shot_list:
    - id: hero-produto-ancora
      description: "close-up cuca/sonho/torta crumb shot — Tartine direction adapted BR"
      lighting: "natural light golden hour 8-10h OR 16-18h"
      mandatory: true
    - id: fachada-bairro
      description: "exterior daytime + golden hour"
      mandatory: true
    - id: mao-padeiro-com-farinha
      description: "lifestyle heritage shot mão-trabalhando-massa"
      mandatory: true
    - id: vitrine-balcao
      description: "vitrine produtos do dia"
      mandatory: true
    - id: produto-detail-shots
      description: "6-8 produtos individuais sobre superfície cream"
      mandatory: true
    - id: familia-hilda-historia
      description: "group shot opcional se família topar"
      mandatory: false
    - id: foto-pb-historica
      description: "scan B&W 1990s se existir — heritage stamp"
      mandatory: false
  direction: "natural light golden hour, warm color grading (Portra 400 vibe — Tartine reference), single product center, vertical-friendly mobile"
  color_grading: "warm shadows, slight desaturation greens (keeps cream/terracota palette dominant)"
  cessao_direitos_required: true
  avoid:
    - "stock photo generic bakery"
    - "filter overlay heavy"
    - "macro pure-white-sugar (too cold)"
    - "people-heavy lifestyle shots (audience 40-65)"

copy:
  tone: "warm-narrativo-story-driven"
  vocabulary_domain: "gastronomia-artesanal"
  readability_target: "6th-grade PT-BR"
  readability_b2b: "n/a (vertical é B2C dominante)"
  vocabulary_examples:
    - "cuca"
    - "sonho"
    - "colomba"
    - "panettone"
    - "fermentação lenta 48h"
    - "feito à mão"
    - "tradição [ano]"
  anti_patterns_rejected:
    - "pâtisserie / maison / pretensão francesa"
    - "Boulanger artisan literal"
    - "Stack ecommerce desnecessário — WhatsApp-first como conversão"
    - "Body 16px ou menor"

legal:
  cdc_specifics:
    - "Site 'recebe pedidos' NÃO 'vende' (Patricia Peck ADR-0002)"
    - "Garantia comercial DEVE ser ADICIONAL à garantia legal CDC art. 26 II (90d vícios)"
  vertical_specific_laws:
    - law: "ANVISA RDC 216/2004"
      applies_to: "Boas práticas manipulação alimentos"
      handle: "Mencionar 'Alvará sanitário em dia' como trust signal se houver"
    - law: "Selo Inspeção Municipal/Estadual/Federal"
      applies_to: "Produtos de origem animal (leite, manteiga, ovo)"
      handle: "Disclaimer rodapé se relevante"
  vigilancia_sanitaria_check_required: true
  cro_cfm_check_required: false
  oab_check_required: false

trust_signals:
  required:
    - heritage-stamp-desde-ano
    - cnpj-visible-footer
    - reviews-aggregate-google
    - whatsapp-button-sticky
    - address-validated-google-maps
  optional:
    - founder-photo-warm
    - foto-pb-historica
    - alvara-sanitario-mencao
    - selo-acib-blumenau                 # ACIB Associação Comercial Industrial Blumenau
    - reviews-tripadvisor-quote
  NOT_required:
    - equipe-meister-identified          # padaria pode anônima
    - certifications-grid                # não-aplicável
    - marcas-atendidas-grid              # auto-only

cta:
  primary:
    type: "whatsapp-deep-link"
    button_text: "💬 Falar pelo WhatsApp"
    prefill_template: "Olá [nome-padaria]! Vi o site e gostaria de encomendar [produto]. Para data: [data]."
    placement: ["hero-cta-primary", "section-encomendas", "header-sticky-mobile", "footer-cta"]
  secondary:
    type: "tel-link"
    button_text: "📞 Ligar"
  tertiary:
    type: "ifood-link"
    button_text: "🍽️ Abrir no iFood"

anti_patterns_global:
  - thin-gray-on-gray
  - hover-only-nav
  - autoplay-carousel
  - body-under-18px
  - touch-target-under-48px
  - contrast-under-7-1-body
  - icon-only-actions
  - hardcoded-content-non-editable
  - lorem-ipsum-or-stock-placeholder-without-label

pipeline_overrides:
  diagnose_apify_required: false       # Insta padaria não-crítico (founder pode passar manualmente)
  niche_research_dimensions:
    - aesthetic-visual                  # PRIMARY
    - market                            # SECONDARY (sazonalidade)
  design_extract_local_refs_min: 2
  design_extract_global_refs_min: 3
  build_phase_organism_count_min: 4    # padaria simples
  production_gate_extras:
    - content-truth-real-prices-or-consulte-whatsapp
    - alvara-sanitario-mencao-if-claim

reassess_triggers:
  - "Tartine sair do ar ou redesenhar grande"
  - "Poilâne mudar template grande"
  - "Hart Bageri redesign"
  - "Ref BR new breakthrough nicho artesanal"
  - "Cliente positioning major shift (Dona Hilda virar 'Dona Hilda Café' premium downtown)"
review_cadence_months: 6
