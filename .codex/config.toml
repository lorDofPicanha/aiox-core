# Agent orchestration limits
# max_depth=2 permite chief→specialist→clone (decisão founder 19/Mai)
# max_threads=8 amplia paralelismo vs default 6
[agents]
max_depth = 2
max_threads = 8

[mcp_servers.aios-brain-bridge]
args = ["D:/jarvis/mcp-bridge/dist/index.js"]
command = "node"

[mcp_servers.aios-brain-bridge.env]
AIOS_BRAIN_BRIDGE_DIR = "D:/jarvis/bridge-data"

[mcp_servers.aios-brain-bridge.tools.search_known_fixes]
