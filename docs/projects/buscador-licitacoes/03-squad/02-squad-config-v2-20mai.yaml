# ─────────────────────────────────────────────────────────────
# COMO CONSULTAR (comandos reais)
# ─────────────────────────────────────────────────────────────
invocation:
  conclave: >
    node .aios-core/core/jarvis/self-consultation.js conclave
    --question "{pergunta}" --project buscador-licitacoes --agent aios-master --experts 3
  single: >
    node .aios-core/core/jarvis/self-consultation.js consult
    --expert "{id}" --question "{pergunta}" --project buscador-licitacoes --agent aios-master
  save: >
    node .aios-core/core/jarvis/self-consultation.js save-response
    --id {id} --expert {id} --response "{resposta}"

