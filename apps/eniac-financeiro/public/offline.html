<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sem conexão — Livro Caixa</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f5f6f8;
        color: #0f1c2e;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        border: 1px solid #e5e8ed;
        border-radius: 1rem;
        background: #fff;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #64748b;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1rem;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sem conexão</h1>
      <p>
        O Livro Caixa precisa de internet para mostrar saldos e lançamentos atualizados. Assim que o
        sinal voltar, é só tentar de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
